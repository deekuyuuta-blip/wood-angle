name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 には Android SDK がプリインストール済み
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 判別処理とPLC受け渡しの試験（Android不要）
      - name: Logic test
        run: |
          S=app/src/main/java/jp/yuta/woodangle
          javac -encoding UTF-8 -d logic-out $S/AngleAnalyzer.java $S/Judge.java $S/Device.java $S/DeviceMemory.java $S/SlmpServer.java ci/LogicTest.java
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp logic-out LogicTest

      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk wood-angle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wood-angle-apk
          path: wood-angle.apk

      # スマホから直接ダウンロードできるよう「latest」リリースに置く
      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest wood-angle.apk \
            --title "木材角度判別 最新版" \
            --notes "コミット ${GITHUB_SHA::7} からの自動ビルド"
